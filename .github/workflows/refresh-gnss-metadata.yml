# Keeps the SVN / SV ID tables baked into index.html in step with the real
# constellations. The orbital elements themselves are fetched live by the page
# and need no maintenance -- this is only the identity metadata, which comes
# from sources that send no CORS headers and so cannot be read from the page.
#
# Commits only when something actually changed; the commit publishes itself,
# since Pages deploys from main.
#
# GitHub disables scheduled workflows in a PUBLIC repository after 60 days
# with no repository activity, and workflow runs themselves are not activity.
# Two things keep this one alive:
#
#   * pushes use REFRESH_PAT, a fine-grained token owned by a human, so they
#     count unambiguously as repository activity (a push made with the default
#     GITHUB_TOKEN may not). Without the secret it falls back to GITHUB_TOKEN
#     and still works -- it just loses that guarantee.
#   * a heartbeat commit if the repository has been quiet for 40 days, since
#     the constellations themselves change only a few times a year and would
#     not otherwise generate a commit inside the window.
#
# If it is ever disabled anyway, GitHub emails the repository admins. Re-enable
# from the Actions tab or with:
#   gh api -X PUT repos/beezly/gps-sky-trails/actions/workflows/refresh-gnss-metadata.yml/enable
name: Refresh GNSS metadata

on:
  schedule:
    - cron: '17 4 * * 1'   # 04:17 UTC every Monday
  workflow_dispatch:
    inputs:
      force_heartbeat:
        description: 'Write the heartbeat commit even if the repository is active (verifies the push credentials)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-gnss-metadata
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A human-owned token where available, so the push counts as activity.
          token: ${{ secrets.REFRESH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh tables from NAVCEN, CelesTrak and the GSC
        run: |
          set -eo pipefail
          python3 tools/update-gnss-metadata.py | tee /tmp/summary.txt

      - name: Commit if anything changed
        id: commit
        run: |
          set -eo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "Tables already match the published constellations — nothing to commit."
            exit 0
          fi
          git commit -m "Refresh GNSS constellation metadata" \
                     -m "$(grep -E '^(GPS|Galileo):' /tmp/summary.txt)" \
                     -- index.html
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed; GitHub Pages will rebuild from main."

      - name: Keep the schedule alive if the repository has gone quiet
        if: steps.commit.outputs.pushed != 'true'
        run: |
          set -eo pipefail
          AGE=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $AGE days ago."
          if [ "$AGE" -lt 40 ] && [ "${{ inputs.force_heartbeat }}" != "true" ]; then
            echo "Inside the 60-day window with room to spare — no heartbeat needed."
            exit 0
          fi
          # A dated, human-readable note is enough to reset the clock, and it
          # records that the tables were checked even though nothing changed.
          printf 'Scheduled metadata refresh last checked the constellations on %s.\nThe tables in index.html were already current. See .github/workflows/refresh-gnss-metadata.yml.\n' \
            "$(date -u +%Y-%m-%d)" > .github/last-refresh.txt
          git add .github/last-refresh.txt
          git commit -m "Keep the scheduled refresh alive" \
                     -m "No constellation changes for $AGE days. GitHub disables scheduled workflows in a public repository after 60 days without repository activity, so record the check to reset the clock."
          git push
          echo "Heartbeat pushed."
